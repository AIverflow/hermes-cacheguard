# cacheguard settings. Put them in your Hermes config.yaml under:
#
# plugins:
#   entries:
#     cacheguard:
#       settings:
#
# All keys are optional. The values below are the defaults.

plugins:
  entries:
    cacheguard:
      settings:
        cli: warn                  # terminal, editor: off | warn | block
        desktop: warn              # desktop app, web UI: off | warn | block
        gateway: "off"             # Telegram and other messaging platforms: off | warn | block
        size_k: 20                 # only act on prompts at least this large, in thousands of tokens
        pause_m: 10                # idle minutes before a chat counts as paused (minimum 1)
        display_on_success: false  # show the result line when the cache was kept (loss and unknown always show)
