name: cacheguard
version: "0.5.0"
tested_hermes: "0.22.7"
description: "Warns or blocks a large chat after a pause, when the prompt cache may have expired, and shows how often the cache was lost."
author: "AIverflow"
requires_hermes: ">=0.22.6"
config_schema:
  cli:
    type: str
    description: "Terminal, editor. off, warn or block; default warn"
  desktop:
    type: str
    description: "Desktop app, web UI. off, warn or block; default warn"
  gateway:
    type: str
    description: "Gateway (Telegram, Discord and other messaging platforms). off, warn or block; default off"
  display_on_success:
    type: bool
    description: "Show the result line when the cache was kept (loss and unknown always show). true or false; default false"
  block_images:
    type: bool
    description: "Also block a message with an image; it must then be attached again. true or false; default false"
  tiny_block:
    type: bool
    description: "One short BLOCKED line instead of three. true or false; default false"
  size_k:
    type: number
    description: "Smallest prompt to act on, in thousands of tokens. Number from 0 to 2000; default 20"
  pause_m:
    type: number
    description: "Idle minutes that count as a pause. Number, 1 or more; default 10"
  journal_rows:
    type: number
    description: "Most calls kept in the stats (a count, not days). Whole number, 1 or more; default 10000"
  chat_files:
    type: number
    description: "Most chats that keep a tracking file, newest first. Whole number, 1 or more; default 200"
provides_middleware:
  - llm_request
  - llm_execution
provides_hooks:
  - transform_llm_output
  - pre_llm_call
